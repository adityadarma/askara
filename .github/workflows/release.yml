# Builds a universal (arm64 + x86_64) Askara.app and publishes it as a GitHub Release.
# Trigger: push a tag such as v0.2.0, or run manually from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example v1.2.3 (the leading v is optional)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Tag push: GITHUB_REF_NAME is the tag. Manual run: the "version" input.
          RAW="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          RAW="${RAW//[[:space:]]/}"
          VERSION="${RAW#v}"
          # Only vX.Y.Z (or X.Y.Z for manual runs) is accepted; v.1.0.0 would become ".1.0.0".
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$RAW'. Use the format vX.Y.Z, for example v1.2.3."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      # The same self-signed certificate as local builds (scripts/make-signing-cert.sh), so every
      # release has the same identity and macOS keeps the app's permissions after updates.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SELF_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SELF_SIGN_P12_PASSWORD }}
        run: |
          if [[ -z "$P12_BASE64" || -z "$P12_PASSWORD" ]]; then
            echo "::error::Secrets SELF_SIGN_P12_BASE64 and SELF_SIGN_P12_PASSWORD are not set."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          # Lets codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"

      # CFBundleVersion = run number, so every release is strictly newer for Sparkle.
      - name: Build universal app
        env:
          ASKARA_VERSION: ${{ steps.version.outputs.version }}
          ASKARA_BUILD: ${{ github.run_number }}
          ASKARA_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          if [[ -z "$ASKARA_SPARKLE_PUBLIC_KEY" ]]; then
            echo "::error::Repository variable SPARKLE_PUBLIC_KEY is not set."
            exit 1
          fi
          ./scripts/bundle.sh --universal
          lipo -archs build/Askara.app/Contents/MacOS/Askara
          # Fail instead of shipping an ad-hoc build, which would reset users' permissions.
          codesign -dvv build/Askara.app 2>&1 | grep -q "^Authority=Askara Self-Signed$" || {
            echo "::error::App is not signed with the Askara Self-Signed certificate."
            exit 1
          }

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="Askara-$VERSION-universal.zip"
          ditto -c -k --keepParent build/Askara.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # appcast.xml is attached to every release; the app reads it from
      # releases/latest/download/appcast.xml, so only the newest release is ever offered.
      - name: Sign update and write appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
          ZIP: ${{ steps.package.outputs.zip }}
          REPO: ${{ github.repository }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::Repository secret SPARKLE_PRIVATE_KEY is not set."
            exit 1
          fi
          SIGN=.build/artifacts/sparkle/Sparkle/bin/sign_update
          # Prints: sparkle:edSignature="..." length="..."
          ATTRS="$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN" --ed-key-file - "$ZIP")"
          URL="https://github.com/$REPO/releases/download/v$VERSION/$ZIP"
          NOTES="https://github.com/$REPO/releases/tag/v$VERSION"
          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Askara</title>
              <item>
                <title>Askara $VERSION</title>
                <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>15.4</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>$NOTES</sparkle:fullReleaseNotesLink>
                <enclosure url="$URL" type="application/octet-stream" $ATTRS />
              </item>
            </channel>
          </rss>
          EOF
          # Sign the feed too, so a tampered appcast is rejected.
          echo "$SPARKLE_PRIVATE_KEY" | "$SIGN" --ed-key-file - appcast.xml
          cat appcast.xml

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          gh release create "v$VERSION" "$ZIP" "$ZIP.sha256" appcast.xml \
            --title "Askara $VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"
